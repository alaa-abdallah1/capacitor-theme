# This workflow will publish a package to NPM automatically when pushing to main branch
# Version increments: 1.0.0 → 1.0.1 → 1.0.2, etc.
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Auto Version and Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Bump patch version
        id: version
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Bump patch version (1.0.0 → 1.0.1 → 1.0.2, etc.)
          npm version patch --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Publish BEFORE persisting anything to git. If this fails (e.g. expired
      # token) no commit/tag is left behind, so the job can simply be re-run.
      # Skip publish if this exact version is already on the registry, which
      # makes a re-run after a successful-publish-but-failed-push idempotent.
      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$NEW_VERSION" version > /dev/null 2>&1; then
            echo "v$NEW_VERSION is already published — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Persist the version bump to git only after a successful publish. Each op
      # is idempotent so a partially-completed previous run can still converge.
      - name: Commit, tag and push version bump
        run: |
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: release v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
          if git ls-remote --exit-code --tags origin "v${NEW_VERSION}" > /dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists on remote — skipping tag."
          else
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
