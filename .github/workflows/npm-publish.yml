# This workflow will publish a package to NPM automatically when pushing to main branch
# Version increments: 1.0.0 → 1.0.1 → 1.0.2, etc.
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Auto Version and Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Skip if commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Derive the next version from what is actually live on npm — NOT from
      # package.json — so a committed-but-never-published version can never
      # cause a collision, gaps self-heal, and re-runs always converge.
      - name: Determine next version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")

          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")

          if [ -z "$PUBLISHED_VERSION" ]; then
            # Never published — release package.json's current version as-is.
            NEW_VERSION="$LOCAL_VERSION"
            echo "Package not yet on npm — releasing v$NEW_VERSION"
          else
            # Bump the patch of whatever is live on npm (1.0.4 → 1.0.5).
            NEW_VERSION=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number);console.log(\`\${a}.\${b}.\${c+1}\`)" "$PUBLISHED_VERSION")
            echo "Latest on npm is v$PUBLISHED_VERSION — releasing v$NEW_VERSION"
          fi

          # Write it into package.json + package-lock.json for publish & commit.
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version > /dev/null
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Publish BEFORE persisting anything to git. If this fails (e.g. expired
      # token) no commit/tag is left behind, so the job can simply be re-run.
      # Skip publish if this exact version is already on the registry, which
      # makes a re-run after a successful-publish-but-failed-push idempotent.
      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$NEW_VERSION" version > /dev/null 2>&1; then
            echo "v$NEW_VERSION is already published — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Persist the version bump to git only after a successful publish. Each op
      # is idempotent so a partially-completed previous run can still converge.
      - name: Commit, tag and push version bump
        run: |
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: release v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
          if git ls-remote --exit-code --tags origin "v${NEW_VERSION}" > /dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists on remote — skipping tag."
          else
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push origin "v${NEW_VERSION}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release v${{ env.NEW_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
